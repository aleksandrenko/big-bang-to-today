<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>От големия взрив до днес</title>
<meta name="description" content="Дърпай слайдъра и виж как от големия взрив се раждат звездите, Земята, животът, динозаврите и хората.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@600;700;800;900&family=Kurale&display=swap">
<style>
/* Deep-space observatory: the scene fills the screen, panels are dark glass, warm starlight is the accent. */
:root{
  --bg:#04061a;--panel:rgba(13,17,46,.84);--panel2:rgba(26,32,78,.9);--ink:#f2f0ff;--muted:#a9b0d6;--line:rgba(160,170,255,.22);
  --accent:#ffb547;--accent2:#6fd3ff;--hot:#ff6b4a;
  --font:'Nunito',system-ui,sans-serif;--display:'Comfortaa','Nunito',system-ui,sans-serif;
  --shadow:0 12px 34px rgba(0,0,10,.5),0 2px 6px rgba(0,0,10,.35);
  --tl:138px;--cardw:min(390px,34vw);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
#hud{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));pointer-events:none;max-width:min(560px,calc(100vw - 32px))}
#when{display:flex;align-items:baseline;gap:.35em;flex-wrap:wrap;font-family:var(--display);font-weight:700;text-shadow:0 0 2px rgba(0,0,20,.9),0 2px 14px rgba(0,0,20,.8),0 0 28px rgba(0,0,20,.6)}
#when b{font-size:clamp(46px,7vw,84px);line-height:.95;color:#fff;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#when span{font-size:clamp(17px,2vw,24px);color:var(--accent)}
#when small{flex-basis:100%;font-family:var(--font);font-weight:800;font-size:15px;color:var(--muted);margin-top:2px}
#when .full{flex-basis:100%;font-style:normal;font-family:var(--font);font-weight:800;font-size:clamp(14px,1.6vw,19px);color:#d9dcff;letter-spacing:.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin-bottom:-2px}
#when.moving .full{color:var(--accent2)}
#when .speed{display:inline-flex;align-items:center;gap:6px;margin-top:4px;color:var(--accent2);font-size:16px}
#eras{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#eras span{display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:900;font-size:13.5px;box-shadow:var(--shadow)}
#eras i{width:11px;height:11px;border-radius:50%;flex:none}
#dock{width:110px;height:150px;margin-top:2px}

/* card */
#card{position:fixed;right:16px;top:16px;bottom:calc(var(--tl) + 14px);width:var(--cardw);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#card .ph{position:relative;flex:none;aspect-ratio:4/3;max-height:44%;background:#0b0f2e;overflow:hidden}
#card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:fadein .6s ease}
#card .ph .cr{position:absolute;left:0;right:0;bottom:0;padding:14px 10px 5px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .ph .cr a{color:#fff}
#card .ph .noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;background:radial-gradient(circle at 50% 40%,#1c2464,#0b0f2e);animation:fadein .6s ease}
#card .body{padding:16px 20px 10px;overflow:auto;flex:1;min-height:0}
#card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:900;font-size:12.5px;background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.chip.w{background:var(--accent);color:#2a1600;border-color:transparent}
#card h2{font-family:var(--display);font-weight:700;font-size:clamp(21px,2.1vw,27px);line-height:1.15;margin:2px 0 10px;text-wrap:balance}
#card p{margin:0;font-size:16.5px;line-height:1.5;font-weight:600;color:#dcdcf5}
#card .next{margin-top:14px;font-size:14px;color:var(--muted);font-weight:700}
#card .nav{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px dashed var(--line);flex:none}
.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:900;font-size:15px;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,background .2s}
.btn:hover{background:#2c3586}.btn:active{transform:scale(.96)}
.btn.pri{background:var(--accent);color:#2a1600;flex:1}.btn.pri:hover{background:#ffc66d}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.4;pointer-events:none}
#card .more{display:none}
@keyframes fadein{from{opacity:0}}

/* timeline */
#tl{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tl) + env(safe-area-inset-bottom));padding:8px max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(4,6,26,0),rgba(4,6,26,.85) 24%,#060a26);user-select:none;-webkit-user-select:none}
#play{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#2a1600;display:grid;place-items:center;box-shadow:0 4px 16px rgba(255,181,71,.35)}
#play svg{width:24px;height:24px}
.step{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--panel2);display:grid;place-items:center}
.step svg{width:20px;height:20px}
#track{position:relative;flex:1;height:112px;touch-action:none;cursor:pointer;min-width:0}
#bands0,#bands1,#bands2{position:absolute;left:0;right:0;overflow:hidden;border-radius:8px}
#bands0{top:2px;height:15px}
#bands1{top:19px;height:20px}
#bands2{top:41px;height:17px}
#bands0 div{opacity:.8;font-size:10px!important}
#bands0 div,#bands1 div,#bands2 div{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11.5px;color:rgba(255,255,255,.95);white-space:nowrap;overflow:hidden;border-right:1px solid rgba(0,0,0,.35);text-shadow:0 1px 2px rgba(0,0,0,.45);cursor:zoom-in}
#bands2 div{font-size:10.5px}
#dots{position:absolute;left:0;right:0;top:62px;height:12px}
.dot{position:absolute;top:0;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);border:2px solid #0a0e2c;border-radius:2px;cursor:pointer;transition:transform .2s}
.dot:hover{transform:rotate(45deg) scale(1.5)}
.dot.on{transform:rotate(45deg) scale(1.7);box-shadow:0 0 0 2px #fff}
#ticks{position:absolute;left:0;right:0;top:76px;height:30px}
#ticks span{position:absolute;transform:translateX(-50%);font-weight:800;font-size:11px;color:var(--muted);top:12px;white-space:nowrap}
#ticks span::before{content:"";position:absolute;left:50%;top:-9px;width:1.5px;height:6px;background:rgba(169,176,214,.6)}
#knob{position:absolute;top:-6px;width:0;height:114px;pointer-events:none}
#knob::before{content:"";position:absolute;left:-1.5px;top:20px;width:3px;height:86px;background:#fff;border-radius:2px;box-shadow:0 0 8px rgba(255,255,255,.6)}
#knob .head{position:absolute;left:-25px;top:-14px;width:50px;height:50px;border-radius:50%;background:#1a2160;border:3px solid var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.5);overflow:hidden;pointer-events:auto;cursor:grab}
#knob .head img{width:100%;height:100%;display:block}
#knob.out{display:none}
#tip{position:absolute;bottom:100%;left:0;transform:translate(-50%,-4px);background:#fff;color:#0a0e2c;font-weight:800;font-size:13px;padding:5px 10px;border-radius:9px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:3}
#tip.show{opacity:1}
#zoom{flex:none;display:flex;flex-direction:column;gap:4px}
#zoom button{width:34px;height:30px;border:0;border-radius:9px;background:var(--panel2);font:900 17px var(--font);line-height:1}
#zoom button#zFit{font-size:12px}
#zoomNote{position:absolute;right:0;top:-18px;font-size:11.5px;font-weight:800;color:var(--accent2);opacity:0;transition:opacity .3s}
#zoomNote.show{opacity:1}

/* intro */
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1b2370 0,#0a0e33 55%,#04061a 100%);transition:opacity .6s,transform .6s}
#intro.leave{opacity:0;transform:scale(1.05);pointer-events:none}
#intro .art{width:min(400px,72vw);max-height:50vh;aspect-ratio:1;animation:bob 3.2s ease-in-out infinite}
#intro .art img{width:100%;height:100%;display:block}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1deg)}}
#intro h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,5.6vw,58px);margin:0;line-height:1.05;text-wrap:balance}
#intro h1 em{font-style:normal;color:var(--accent)}
#intro p{margin:0;max-width:38ch;font-weight:700;font-size:clamp(16px,2vw,19px);color:var(--muted)}
#go{flex:none;margin-top:10px;font-size:20px;padding:14px 46px;border-radius:999px}
#introStars{position:absolute;inset:0;z-index:-1}

@media (max-width:760px){
  :root{--tl:118px}
  #card{left:10px;right:10px;width:auto;top:auto;bottom:calc(var(--tl) + env(safe-area-inset-bottom) + 6px);max-height:42vh;border-radius:18px}
  #card .ph{position:absolute;left:12px;top:12px;width:84px;height:84px;aspect-ratio:auto;border-radius:12px;max-height:none}
  #card .ph .cr{display:none}
  #card .ph .noimg{font-size:40px}
  #card .body{padding:12px 14px 8px 108px;min-height:108px}
  #card h2{font-size:19px;margin-bottom:6px}
  #card p{font-size:15px;line-height:1.42}
  #card:not(.open) p,#card:not(.open) .next{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #card .more{display:inline-flex}
  #when b{font-size:40px}
  .step,#zoom{display:none}
  #play{width:46px;height:46px}
  #bands0 div,#bands1 div,#bands2 div{font-size:0!important}
  #dock{width:96px;height:128px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Картина на Вселената в избраното време"></canvas>

<div id="hud">
  <div id="when"><b>13,8</b><span>милиарда години</span><small>преди днес</small></div>
  <div id="eras"></div>
  <div id="dock" aria-hidden="true"></div>
</div>

<aside id="card" aria-live="polite">
  <div class="ph"></div>
  <div class="body"></div>
  <div class="nav">
    <button class="btn" id="prev" aria-label="Предишно събитие"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="btn more" id="more">Още</button>
    <button class="btn pri" id="next">Напред <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</aside>

<div id="tl">
  <button id="play" aria-label="Пусни"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
  <button class="step" id="sPrev" aria-label="Предишно събитие"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="track">
    <div id="zoomNote"></div>
    <div id="bands0"></div>
    <div id="bands1"></div>
    <div id="bands2"></div>
    <div id="dots"></div>
    <div id="ticks"></div>
    <div id="knob"><div id="tip"></div><div class="head"><img src="traveler-head.svg" alt=""></div></div>
  </div>
  <button class="step" id="sNext" aria-label="Следващо събитие"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <div id="zoom" aria-label="Мащаб">
    <button id="zIn" aria-label="Приближи времето">+</button>
    <button id="zOut" aria-label="Отдалечи времето">−</button>
    <button id="zFit" aria-label="Цялото време">всичко</button>
  </div>
</div>

<div id="intro">
  <canvas id="introStars"></canvas>
  <div class="art"><img src="traveler.svg" alt="Чудовището пътешественик във времето"></div>
  <h1>От <em>големия взрив</em> до днес</h1>
  <p>13,8 милиарда години в един слайдър: звезди, планети, първия живот, динозаврите и хората. Хвани ме и тръгваме!</p>
  <button class="btn pri" id="go">Тръгваме!</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="events.js"></script>
<script src="eras.js"></script>
<script src="paleo-points.js"></script>
<script src="photos.js"></script>
<script src="life.js"></script>
<script src="life-paths.js"></script>
<script src="scenes.js"></script>
<script src="globe.js"></script>
<script src="app.js"></script>
<script src="narrator.js" defer></script>
</body>
</html>
